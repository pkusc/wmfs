[package]
name = "wmfs-testkit"
description = "测试专用：多进程集群框架、Jepsen-lite 检查器、profile 测试、模拟掉电的存储后端；金样文件在 golden/"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
wmfs-core.workspace = true
wmfs-plugins = { workspace = true, features = ["tcp", "shared-key", "rdma", "posix-mode", "label-match"] }
plugin-mem-transport.workspace = true
crc32c.workspace = true
redb.workspace = true
raft.workspace = true
protobuf.workspace = true
crossbeam-channel.workspace = true

# 组件测试（design.md 9.3 的思路：单进程，经 mem 或回环 TCP 互连）。端口一律 127.0.0.1:0，由系统分配。
[[test]]
name = "net_rpc"
path = "it/net_rpc.rs"

[[test]]
name = "slow_client"
path = "it/slow_client.rs"

[[test]]
name = "failpoint_retry"
path = "it/failpoint_retry.rs"

[[test]]
name = "failpoint_authn"
path = "it/failpoint_authn.rs"

[[test]]
name = "conn_faults"
path = "it/conn_faults.rs"

[[test]]
name = "conn_idle"
path = "it/conn_idle.rs"

[[test]]
name = "reconnect"
path = "it/reconnect.rs"

# M3：元数据 Raft（design.md 9.2：确定性模拟用模拟掉电的内存后端；附录 A 每个坑一个回归用例）。
[[test]]
name = "raft_sim"
path = "it/raft_sim.rs"

[[test]]
name = "raft_pitfalls"
path = "it/raft_pitfalls.rs"

[[test]]
name = "raft_compact"
path = "it/raft_compact.rs"

[[test]]
name = "failpoint_raft_abort"
path = "it/failpoint_raft_abort.rs"

[[test]]
name = "failpoint_raft_order"
path = "it/failpoint_raft_order.rs"

[[test]]
name = "failpoint_meta"
path = "it/failpoint_meta.rs"

[[test]]
name = "meta_engine"
path = "it/meta_engine.rs"

[[test]]
name = "meta_service"
path = "it/meta_service.rs"

# M4：命名空间与会话（design.md 9.1 的 POSIX 元数据语义、9.4 的 meta.reply.drop）。
[[test]]
name = "meta_ns"
path = "it/meta_ns.rs"

[[test]]
name = "meta_ns_rename"
path = "it/meta_ns_rename.rs"

[[test]]
name = "meta_ns_attr"
path = "it/meta_ns_attr.rs"

[[test]]
name = "meta_ns_random"
path = "it/meta_ns_random.rs"

[[test]]
name = "meta_ns_engine"
path = "it/meta_ns_engine.rs"

[[test]]
name = "failpoint_reply_drop"
path = "it/failpoint_reply_drop.rs"

[[test]]
name = "failpoint_ns_plugins"
path = "it/failpoint_ns_plugins.rs"

[lints]
workspace = true
