[package]
name = "wmfs-testkit"
description = "测试专用：多进程集群框架、Jepsen-lite 检查器、profile 测试、模拟掉电的存储后端；金样文件在 golden/"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
wmfs-core.workspace = true
wmfs-plugins = { workspace = true, features = ["tcp", "shared-key", "rdma", "posix-mode", "posix-acl", "path-caps", "quota", "label-match", "local-fs", "crc32c", "replica", "fifo", "gc", "xxh3", "blake3", "lz4", "zstd", "aes-gcm", "reconciler", "scrub", "trash-expire", "ttl"] }
plugin-mem-transport.workspace = true
crc32c.workspace = true
redb.workspace = true
raft.workspace = true
protobuf.workspace = true
crossbeam-channel.workspace = true
wmfs-mgr.workspace = true

# 组件测试（design.md 9.3 的思路：单进程，经 mem 或回环 TCP 互连）。端口一律 127.0.0.1:0，由系统分配。
