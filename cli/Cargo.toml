[package]
name = "wmfs"
description = "wmfs 的唯一二进制：所有子命令、插件注册表 registry.rs、FUSE 适配层"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wmfs"
path = "src/main.rs"

[features]
# 每个插件一个 feature（design.md 2.1、3.7.5），默认启用全部首发插件；mem 是独立 crate 的示例传输，默认不编进来。
default = ["tcp", "shared-key", "rdma", "posix-mode", "label-match", "local-fs", "crc32c", "replica", "fifo", "gc", "cache-memory"]
tcp = ["wmfs-plugins/tcp"]
shared-key = ["wmfs-plugins/shared-key"]
posix-mode = ["wmfs-plugins/posix-mode"]
label-match = ["wmfs-plugins/label-match"]
rdma = ["wmfs-plugins/rdma"]
local-fs = ["wmfs-plugins/local-fs"]
crc32c = ["wmfs-plugins/crc32c"]
replica = ["wmfs-plugins/replica"]
fifo = ["wmfs-plugins/fifo"]
gc = ["wmfs-plugins/gc"]
cache-memory = ["wmfs-plugins/cache-memory"]
mem = ["dep:plugin-mem-transport"]

[dependencies]
wmfs-core.workspace = true
wmfs-plugins.workspace = true
wmfs-mgr.workspace = true
plugin-mem-transport = { workspace = true, optional = true }
clap.workspace = true
fuser.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# FUSE 端到端测试（cli/tests/）：起完整节点用 testkit 的 harness::node，挂载用 CARGO_BIN_EXE_wmfs（只有二进制所在的包有它）；
# libc 只给测试取打开标志（O_SYNC、O_DIRECT）用，cli 本身经 core 接触系统接口（0.2 第 4 条）
wmfs-testkit.workspace = true
libc.workspace = true

[lints]
workspace = true

# minimal profile 的冒烟（design.md 9.7）：文件在仓库根的 tests/profiles/，因为要 CARGO_BIN_EXE_wmfs 而挂在 cli 包下；
# 用开发集群的固定端口，所以用例是 #[ignore]，由 scripts/profiles.sh minimal 跑。
[[test]]
name = "profile_minimal"
path = "../tests/profiles/minimal.rs"

# nas-safe profile 的阶段版（design.md 9.7，M9 起）：同上，由 scripts/profiles.sh nas-safe 跑。
[[test]]
name = "profile_nas_safe"
path = "../tests/profiles/nas_safe.rs"

