[package]
name = "wmfs-plugins"
description = "wmfs 的全部进程内首发插件：每个插件一个目录、一个 cargo feature（默认全开）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
# 每个插件一个 feature（design.md 2.1）；插件从 M1 起逐个加入。
default = []

[dependencies]
wmfs-core.workspace = true

[lints]
workspace = true
