[package]
name = "wmfs-plugins"
description = "wmfs 的全部进程内首发插件：每个插件一个目录、一个 cargo feature（默认全开）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
# 每个插件一个 feature（design.md 2.1），默认全开；插件从 M1 起逐个加入。
default = ["tcp", "shared-key", "rdma", "posix-mode", "posix-acl", "path-caps", "quota", "label-match", "local-fs", "crc32c", "replica", "fifo", "gc", "cache-memory", "xxh3", "blake3", "lz4", "zstd", "aes-gcm", "reconciler", "scrub"]
tcp = []
shared-key = []
posix-mode = []
# M10：授权与配额
posix-acl = []
path-caps = []
quota = []
label-match = []
# M5：单节点数据路径
local-fs = []
crc32c = ["dep:crc32c"]
replica = []
fifo = []
gc = ["dep:serde"]
# M6：客户端缓存
cache-memory = []
# M11：其余的变换（校验和、压缩、加密）与后台任务
xxh3 = ["dep:xxhash-rust"]
blake3 = ["dep:blake3"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]
aes-gcm = ["dep:aes-gcm"]
reconciler = ["dep:serde"] # 游标是 postcard（serde），与 rdma 的 RdmaSetup 帧一样
scrub = ["dep:serde"]
# M2：RDMA 传输（sideway；rdma-mummy-sys 在运行时 dlopen libibverbs，没有 RDMA 的机器也能编译、运行；
# 编译它要 cmake 与 libclang，design.md 2.3）。插件私有的 RdmaSetup 帧与 core 的帧一样：postcard body（serde）+ crc32c。
rdma = ["dep:sideway", "dep:crc32c", "dep:serde"]

# 插件只用 wmfs-core 的公开 API（指标、fail point 经 wmfs_core::api；插件配置表是 wmfs_core::base::config::PluginTable），
# 不直接依赖 wmfs-api 或 toml（design.md 2.1；scripts/ci.sh rules 检查）。
[dependencies]
wmfs-core.workspace = true
sideway = { workspace = true, optional = true }
crc32c = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }

[dev-dependencies]
crc32c.workspace = true

[lints]
workspace = true
